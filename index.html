html,body{min-height:100%}

@media (max-width:900px){.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}

function leerMonto(v) {

  else if (/,\d{1,2}$/.test(s)) s = s.replace(',', '.');

function mensajeDe(d, st) {

async function pedir(ruta, opc = {}) {
  const h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  if (opc.ses !== false && ses) h.Authorization = 'Bearer ' + ses.access_token;
  if (opc.prefer) h.Prefer = opc.prefer;
  let r;
  try { r = await fetch(SB_URL + ruta, { method: opc.metodo || 'POST', headers: h, body: opc.cuerpo === undefined ? undefined : JSON.stringify(opc.cuerpo) }); }
  catch (e) { throw new Error('Sin conexión. Revisa tu internet e inténtalo de nuevo.'); }
  const x = await r.text(); let d = null; try { d = x ? JSON.parse(x) : null; } catch (e) { }
  if (!r.ok) { const er = new Error(mensajeDe(d, r.status)); er.status = r.status; throw er; }
  return d;
}
async function token() {
  if (!ses) { const e = new Error('Sin sesión'); e.status = 401; throw e; }
  if (ses.expires_at - Date.now() / 1000 > 90) return;
  try {
    const d = await pedir('/auth/v1/token?grant_type=refresh_token', { cuerpo: { refresh_token: ses.refresh_token }, ses: false });
    guardarSes({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() / 1000 + d.expires_in });
  } catch (e) { if (e.status >= 400 && e.status < 500) e.status = 401; throw e; }
}

  return r;
}

  const [cfg, partidas, ocus, cuentas, saldos] = await Promise.all([
    api('GET', `fin_config?select=*&modo=eq.${modo}${fE}&limit=1`),
    leerTodo(`fin_partidas?select=*&modo=eq.${modo}${fE}&order=creado_el,id`),
    leerTodo(`fin_ocurrencias?select=partida_id,fecha,hecho,hecho_el,monto,omitida,fin_partidas!inner(id)${fJ('fin_partidas')}&order=partida_id,fecha`),
    leerTodo(`fin_cuentas?select=*&modo=eq.${modo}${fE}&order=creado_el,id`),
    leerTodo(`fin_saldos?select=cuenta_id,fecha,monto,fin_cuentas!inner(id)${fJ('fin_cuentas')}&order=cuenta_id,fecha`)]);
  D = { cfg: (cfg && cfg[0]) || null, partidas, ocus: {}, cuentas, saldos };

/* ---------- Ingresos, gastos, movimientos ---------- */
function describir(p) {
  const d = +p.fecha.slice(8, 10), f = p.frecuencia;
  let t = f === 'unico' ? 'Una vez · ' + dia(p.fecha)
    : f === 'quincenal' ? 'Cada quincena · 15 y fin de mes'
      : f === 'semanal' || f === 'bisemanal' ? FREC[f] + ' · los ' + DIAS[new Date(p.fecha + 'T12:00:00Z').getUTCDay()]
        : f === 'anual' ? 'Cada año · ' + d + ' ' + MES3[+p.fecha.slice(5, 7) - 1]
          : FREC[f] + ' · día ' + (d >= 29 ? d + ' (o fin de mes)' : d);
  if (f !== 'unico' && p.fecha_fin) t += ' · hasta ' + dia(p.fecha_fin);
  return t;
}
function proxima(p) { return M.fechas(p, hoy, M.sumarDias(hoy, 800))[0] || null; }
function vPartidas(tipo) {
  const ini = M.fechaDe(mes.y, mes.m, 1), fin = M.finMes(mes.y, mes.m), q = filtro.q.trim().toLowerCase();
  const ver = tipo || (filtro.tipo === 'todos' ? null : filtro.tipo);
  let l = D.partidas.filter(p => (!ver || p.tipo === ver) && (!q || [p.nombre, p.categoria, p.contraparte, p.comprobante, p.centro].join(' ').toLowerCase().includes(q)));
  l = l.map(p => ({ p, prox: p.activo ? proxima(p) : null })).sort((a, b) => (a.prox || '9') < (b.prox || '9') ? -1 : (a.prox || '9') > (b.prox || '9') ? 1 : a.p.nombre.localeCompare(b.p.nombre));
  const delMes = t => M.eventos(D.partidas.filter(p => p.tipo === t), D.ocus, ini, fin).filter(e => !e.omitida).reduce((a, e) => a + e.cent, 0) / 100;
  const tit = tipo === 'ingreso' ? 'Ingresos' : tipo === 'gasto' ? 'Pagos y gastos' : 'Movimientos';
  const fila = ({ p, prox }) => `<div class="ev ${p.tipo === 'ingreso' ? 'ing' : 'gas'} ${p.activo ? '' : 'omit'}"><button class="ev-c" data-a="editar" data-p="${p.id}">

      <span class="ev-s">${esc([describir(p), p.categoria, p.contraparte, p.comprobante, p.centro].filter(Boolean).join(' · '))}</span>
      <span class="ev-q">${!p.activo ? 'en pausa' : prox ? 'próximo: ' + dia(prox) : 'terminado'}</span></button></div>`;
  return `
    <div class="fila"><h1>${tit}</h1><span class="sep"></span>${navMes()}</div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">

      ${tipo !== 'ingreso' ? `<div class="kpi"><span class="rot">Pagos y gastos de ${MES[mes.m - 1]}</span><b>${fmt(delMes('gasto'))}</b></div>` : ''}
    </div>

}

/* ---------- Flujo de caja ---------- */
function vFlujo() {
  const c = CFG(), n = 6, per = M.periodos(c, D.partidas, D.ocus, mes.y, mes.m, n), meses = [];
  for (let i = 0; i < n; i++) {
    const a = per[2 * i], b = per[2 * i + 1], ev = b.antes ? [] : M.eventos(D.partidas, D.ocus, a.desde < c.fecha_inicial ? c.fecha_inicial : a.desde, b.hasta).filter(e => M.cuenta(c, e));
    const cat = { 1: {}, '-1': {} }; ev.forEach(e => { const k = e.p.categoria || 'Sin categoría'; cat[e.signo][k] = (cat[e.signo][k] || 0) + e.cent; });
    meses.push({ y: a.y, m: a.m, antes: b.antes, ini: b.antes ? null : (a.antes ? b.base : a.base), fin: b.saldo, cat });
  }
  const filas = signo => { const k = {}; meses.forEach(x => Object.keys(x.cat[signo]).forEach(c2 => k[c2] = 1)); return Object.keys(k).sort(); };
  const celda = (v, cls = '') => `<td class="${cls} ${v !== null && v < 0 ? 'neg' : ''}">${v === null ? '—' : fmt(v)}</td>`;
  const bloque = (signo, tit) => {
    const cs = filas(signo);
    return `<tr class="cab"><td colspan="${n + 1}">${tit}</td></tr>` + cs.map(k => `<tr><td>${esc(k)}</td>${meses.map(x => celda(x.antes ? null : (x.cat[signo][k] || 0) / 100)).join('')}</tr>`).join('') +
      `<tr class="tot"><td>Total ${tit.toLowerCase()}</td>${meses.map(x => celda(x.antes ? null : Object.values(x.cat[signo]).reduce((a, v) => a + v, 0) / 100)).join('')}</tr>`;
  };
  return `<div class="fila"><h1>Flujo de caja</h1><span class="sep"></span>${navMes()}</div>
    <p class="dim">Proyección de 6 meses según las fechas programadas, partiendo de la caja del ${dia(c.fecha_inicial)}.</p>
    <div class="tw"><table id="tFlujo"><thead><tr><th>Concepto</th>${meses.map(x => `<th>${MES3[x.m - 1]} ${x.y}</th>`).join('')}</tr></thead><tbody>
      <tr class="tot"><td>Caja al inicio</td>${meses.map(x => celda(x.ini)).join('')}</tr>
      ${bloque(1, 'Ingresos')}${bloque(-1, 'Gastos')}
      <tr class="tot"><td>Flujo neto del mes</td>${meses.map(x => celda(x.antes ? null : Math.round((x.fin - x.ini) * 100) / 100)).join('')}</tr>
      <tr class="tot"><td>Caja al cierre</td>${meses.map(x => celda(x.fin)).join('')}</tr>
    </tbody></table></div>`;
}

/* ---------- Resultado y presupuesto ---------- */
function resultadoMes() {
  const ev = M.eventos(D.partidas, D.ocus, M.fechaDe(mes.y, mes.m, 1), M.finMes(mes.y, mes.m)).filter(e => !e.omitida), pres = CFG().presupuesto || {};
  const filas = tipo => {
    const k = {}; ev.filter(e => e.p.tipo === tipo).forEach(e => { const c = e.p.categoria || 'Sin categoría'; k[c] = (k[c] || 0) + e.cent; });
    Object.keys(pres).forEach(c => { if (c.startsWith(tipo + '|') && !(c.slice(tipo.length + 1) in k)) k[c.slice(tipo.length + 1)] = 0; });
    return Object.keys(k).sort().map(c => ({ cat: c, real: k[c] / 100, pres: Number(pres[tipo + '|' + c] || 0) }));
  };
  return { ingreso: filas('ingreso'), gasto: filas('gasto') };
}
function vResultado() {
  const r = resultadoMes(), suma = (l, k) => l.reduce((a, x) => a + x[k], 0);
  const bloque = (l, tit, esGasto) => `<tr class="cab"><td colspan="5">${tit}</td></tr>` + l.map(x => {
    const pct = x.pres ? x.real / x.pres : null, pas = esGasto && x.pres && x.real > x.pres;
    return `<tr><td>${esc(x.cat)}</td><td>${x.pres ? fmt(x.pres) : '—'}</td><td>${fmt(x.real)}</td><td class="${x.pres && (esGasto ? x.real > x.pres : x.real < x.pres) ? 'neg' : ''}">${x.pres ? fmt(x.real - x.pres) : '—'}</td>
      <td>${pct === null ? '' : `<div class="fila" style="justify-content:flex-end;flex-wrap:nowrap"><span>${Math.round(pct * 100)}%</span><div class="barrita ${pas ? 'pas' : ''}"><i style="width:${Math.min(100, pct * 100)}%"></i></div></div>`}</td></tr>`;
  }).join('') + `<tr class="tot"><td>Total ${tit.toLowerCase()}</td><td>${fmt(suma(l, 'pres'))}</td><td>${fmt(suma(l, 'real'))}</td><td>${fmt(suma(l, 'real') - suma(l, 'pres'))}</td><td></td></tr>`;
  const res = suma(r.ingreso, 'real') - suma(r.gasto, 'real'), resP = suma(r.ingreso, 'pres') - suma(r.gasto, 'pres');
  return `<div class="fila"><h1>Resultado y presupuesto</h1><span class="sep"></span>${navMes()}${puedeTodo() ? '<button class="bt" data-a="presupuesto">Editar presupuesto</button>' : ''}</div>
    <p class="dim">Lo programado del mes (con los montos reales que se hayan anotado) frente al presupuesto mensual por categoría.</p>
    <div class="tw"><table id="tRes"><thead><tr><th>Categoría</th><th>Presupuesto</th><th>Del mes</th><th>Diferencia</th><th>Avance</th></tr></thead><tbody>
      ${bloque(r.ingreso, 'Ingresos', false)}${bloque(r.gasto, 'Gastos', true)}
      <tr class="tot"><td>Resultado del mes</td><td>${fmt(resP)}</td><td class="${res < 0 ? 'neg' : ''}">${fmt(res)}</td><td class="${res - resP < 0 ? 'neg' : ''}">${fmt(res - resP)}</td><td></td></tr>
    </tbody></table></div>`;
}

/* ---------- Gráfico de línea (una sola serie) ---------- */
function pasoBonito(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function dibujar() {
  graficos.forEach(g => {
    const el = document.getElementById(g.id); if (!el) return;
    const pts = g.pts; if (!pts.length) { el.innerHTML = '<div class="dim">Sin datos todavía.</div>'; return; }
    const W = Math.max(280, el.clientWidth), H = W < 480 ? 190 : 230, ml = W < 480 ? 58 : 72, mr = 18, mt = 18, mb = 26;
    const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
    if (g.cero) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
    if (hi === lo) { hi += 1; lo -= g.cero ? 0 : 1; }
    const paso = pasoBonito((hi - lo) / 4); lo = Math.floor(lo / paso) * paso; hi = Math.ceil(hi / paso) * paso;
    const X = i => ml + (pts.length === 1 ? (W - ml - mr) / 2 : i * (W - ml - mr) / (pts.length - 1)), Y = v => mt + (hi - v) * (H - mt - mb) / (hi - lo);
    let s = '';
    for (let v = lo; v <= hi + paso / 2; v += paso) s += `<line class="${Math.abs(v) < paso / 1e6 && lo < 0 ? 'g-0' : 'g-l'}" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt0(v)}</text>`;
    const cada = Math.ceil(pts.length / Math.max(2, Math.floor((W - ml - mr) / 64)));
    pts.forEach((p, i) => { if (i % cada === 0 || (i === pts.length - 1 && (pts.length - 1) % cada > cada / 2)) s += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(p.x)}</text>`; });
    const linea = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    if (g.cero && pts.length > 1) s += `<path class="g-a" d="${linea} L${X(pts.length - 1).toFixed(1)} ${Y(0)} L${X(0).toFixed(1)} ${Y(0)} Z"/>`;
    s += `<path class="g-s" d="${linea}"/>`;
    pts.forEach((p, i) => s += `<circle class="g-p ${p.y < 0 ? 'neg' : ''}" cx="${X(i)}" cy="${Y(p.y)}" r="${pts.length > 24 ? 2.5 : 4}"/>`);
    const u = pts.length - 1;
    s += `<text class="g-v" x="${X(u)}" y="${Y(pts[u].y) + (u && pts[u].y < pts[u - 1].y ? 20 : -10)}" text-anchor="end">${fmt0(pts[u].y)}</text>`;
    s += `<line class="g-x" id="${g.id}x" y1="${mt}" y2="${H - mb}" x1="0" x2="0" visibility="hidden"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Gráfico de línea: ${esc(pts[0].t)} ${fmt(pts[0].y)}; ${esc(pts[u].t)} ${fmt(pts[u].y)}">${s}<rect x="${ml - 10}" y="0" width="${W - ml - mr + 20}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
    const tip = el.querySelector('.tip'), cruz = el.querySelector('.g-x'), svg = el.querySelector('svg');
    const mover = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      let i = 0; pts.forEach((p, k) => { if (Math.abs(X(k) - px) < Math.abs(X(i) - px)) i = k; });
      cruz.setAttribute('x1', X(i)); cruz.setAttribute('x2', X(i)); cruz.setAttribute('visibility', 'visible');
      tip.innerHTML = `${esc(pts[i].t)}<b>${fmt(pts[i].y)}</b>`; tip.hidden = false;
      const tx = X(i) * r.width / W, tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(r.width - tw, tx + (tx + tw + 14 > r.width ? -tw - 10 : 10))) + 'px';
      tip.style.top = Math.max(0, Y(pts[i].y) * r.height / H - 52) + 'px';
    };
    svg.addEventListener('pointermove', mover); svg.addEventListener('pointerdown', mover);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; cruz.setAttribute('visibility', 'hidden'); });
  });
}
let tRes; window.addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(() => { if (ctx && !$('#app').hidden) dibujar(); }, 150); });

/* ---------- Ventanas ---------- */
let alGuardar = null;
function ventana(html, guardar) {
  alGuardar = guardar || null;
  $('#modal').innerHTML = `<div class="velo" data-a="veloCerrar"><form class="vent" id="vent" novalidate>${html}<div class="err" id="vErr" role="alert"></div></form></div>`;
  const f = $('#vent'); f.addEventListener('submit', e => { e.preventDefault(); enviar(); });
  const p = f.querySelector('[autofocus]'); if (p && matchMedia('(min-width:641px)').matches) p.focus();
}
function cerrar() { $('#modal').innerHTML = ''; alGuardar = null; }
async function enviar(extra) {
  if (!alGuardar) return;

    hojas: [
      { nombre: 'Quincenas', titulo: 'Lo que queda en cada quincena (acumulado) · saldo de partida ' + fmt(Number(c.saldo_inicial)) + ' al ' + c.fecha_inicial,
        columnas: [{ clave: 'desde', titulo: 'Desde', tipo: 'fecha' }, { clave: 'hasta', titulo: 'Hasta', tipo: 'fecha' }, { clave: 'ingresos', titulo: 'Ingresos', tipo: 'moneda' }, { clave: 'gastos', titulo: 'Pagos y gastos', tipo: 'moneda' }, { clave: 'saldo', titulo: 'Queda (acumulado)', tipo: 'moneda' }],
        filas: per.filter(q => !q.antes).map(q => ({ ...q, desde: q.desde < c.fecha_inicial ? c.fecha_inicial : q.desde })) },
      { nombre: 'Calendario', titulo: 'Movimientos por fecha · 12 meses',
        columnas: [{ clave: 'fecha', titulo: 'Fecha', tipo: 'fecha' }, { clave: 'tipo', titulo: 'Tipo' }, { clave: 'nombre', titulo: 'Nombre' }, { clave: 'categoria', titulo: 'Categoría' }, ...extra, { clave: 'monto', titulo: 'Monto', tipo: 'moneda' }, { clave: 'estado', titulo: 'Estado' }, { clave: 'queda', titulo: 'Queda', tipo: 'moneda' }], filas: cal },
      { nombre: 'Ingresos y gastos', titulo: 'Ingresos y gastos registrados',
        columnas: [{ clave: 'tipo', titulo: 'Tipo' }, { clave: 'nombre', titulo: 'Nombre' }, { clave: 'monto', titulo: 'Monto', tipo: 'moneda' }, { clave: 'frec', titulo: 'Frecuencia' }, { clave: 'fecha', titulo: 'Primera fecha', tipo: 'fecha' }, { clave: 'fecha_fin', titulo: 'Hasta', tipo: 'fecha' }, { clave: 'categoria', titulo: 'Categoría' }, ...extra, { clave: 'notas', titulo: 'Notas' }, { clave: 'estado', titulo: 'Estado' }],
        filas: D.partidas.map(p => ({ ...p, tipo: p.tipo === 'ingreso' ? 'Ingreso' : 'Gasto', frec: FREC[p.frecuencia], estado: p.activo ? 'Activo' : 'En pausa' })) },
      { nombre: emp ? 'Cuentas' : 'Ahorros', titulo: T().ctasTit + ' · saldos registrados',
        columnas: [{ clave: 'cuenta', titulo: 'Cuenta' }, { clave: 'tipo', titulo: 'Tipo' }, { clave: 'fecha', titulo: 'Fecha', tipo: 'fecha' }, { clave: 'monto', titulo: 'Saldo', tipo: 'moneda' }],
        filas: D.saldos.map(x => { const k = D.cuentas.find(q => q.id === x.cuenta_id) || {}; return { cuenta: k.nombre, tipo: TIPOS_CTA[k.tipo], fecha: x.fecha, monto: x.monto }; }).sort((a, b) => (a.cuenta + a.fecha).localeCompare(b.cuenta + b.fecha)) }]
  });
}

/* ---------- Acciones ---------- */
const error = e => toast(e.message || 'Algo salió mal.');
const ACC = {
  reintentar: comprobar,
  vista: b => { vista = b.dataset.v; pintar(); scrollTo(0, 0); },
  modo: async b => {
    if (b.dataset.v === modo) return;
    const antes = modo; modo = b.dataset.v;
    try { await abrir(); vista = 'resumen'; pintar(); try { localStorage.setItem('yf_modo', modo); } catch (e) { } }
    catch (e) { modo = antes; error(e); }
  },
  mes: b => { const d = +b.dataset.v; if (!d) mes = { y: +hoy.slice(0, 4), m: +hoy.slice(5, 7) }; else { mes.m += d; if (mes.m < 1) { mes.m = 12; mes.y--; } if (mes.m > 12) { mes.m = 1; mes.y++; } } pintar(); },
  tema: () => { const c = document.documentElement.getAttribute('data-tema') === 'claro'; if (c) document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', 'claro'); try { localStorage.setItem('yp_tema', c ? 'oscuro' : 'claro'); } catch (e) { } pintarTema(); },
  excel: b => { b.disabled = true; excel().catch(error).finally(() => b.disabled = false); },
  nueva: b => fPartida(null, b.dataset.v),
  editar: b => fPartida(D.partidas.find(x => x.id === b.dataset.p)),
  fTipo: b => { document.querySelectorAll('#fTipo button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#vent').ajustar(); },
  ftipo: b => { filtro.tipo = b.dataset.v; pintar(); },
  atrasos: () => { verAtrasos = !verAtrasos; pintar(); },
  ocu: b => fOcurrencia(b.dataset.p, b.dataset.f),
  ocuX: b => enviar(b.dataset.v),
  hecho: async b => {
    const k = b.dataset.p + '|' + b.dataset.f, o = D.ocus[k] || {}; b.disabled = true;
    try {
      const r = await api('POST', 'fin_ocurrencias?on_conflict=partida_id,fecha', { partida_id: b.dataset.p, fecha: b.dataset.f, hecho: !o.hecho, monto: o.monto ?? null, omitida: false }, 'resolution=merge-duplicates,return=representation');
      if (!r || !r.length) throw new Error(SINPERMISO);
      D.ocus[k] = r[0]; pintar();
    } catch (e) { b.disabled = false; error(e); }
  },
  saldo: fSaldo,
  pasar: fPasar,
  cuenta: b => fCuenta(b.dataset.c),
  regSaldo: b => fRegSaldo(b.dataset.c),
  historial: b => fHistorial(b.dataset.c),
  presupuesto: fPresupuesto,
  cerrar: cerrar,
  veloCerrar: (b, e) => { if (e.target === b) cerrar(); },
  borrarPartida: async b => {
    if (!confirm('¿Eliminar este registro y todo su historial de pagos? No se puede deshacer.')) return;
    try { const r = await api('DELETE', 'fin_partidas?id=eq.' + b.dataset.p, undefined, 'return=representation'); if (!r || !r.length) throw new Error(SINPERMISO);
      D.partidas = D.partidas.filter(x => x.id !== b.dataset.p); cerrar(); pintar(); toast('Eliminado'); } catch (e) { $('#vErr').textContent = e.message; }
  },
  borrarCuenta: async b => {
    if (!confirm('¿Eliminar esta cuenta y todos sus saldos registrados? No se puede deshacer. Si solo quieres que deje de sumar, usa «Archivada».')) return;
    try { const r = await api('DELETE', 'fin_cuentas?id=eq.' + b.dataset.c, undefined, 'return=representation'); if (!r || !r.length) throw new Error(SINPERMISO);
      D.cuentas = D.cuentas.filter(x => x.id !== b.dataset.c); D.saldos = D.saldos.filter(x => x.cuenta_id !== b.dataset.c); cerrar(); pintar(); toast('Cuenta eliminada'); } catch (e) { $('#vErr').textContent = e.message; }
  },
  borrarSaldo: async b => {
    if (!confirm('¿Eliminar el saldo del ' + dia(b.dataset.f) + '?')) return;
    try { const r = await api('DELETE', `fin_saldos?cuenta_id=eq.${b.dataset.c}&fecha=eq.${b.dataset.f}`, undefined, 'return=representation'); if (!r || !r.length) throw new Error(SINPERMISO);
      D.saldos = D.saldos.filter(x => !(x.cuenta_id === b.dataset.c && x.fecha === b.dataset.f)); pintar(); fHistorial(b.dataset.c); } catch (e) { $('#vErr').textContent = e.message; }
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const f = ACC[b.dataset.a]; if (f) f(b, e); });
document.addEventListener('input', e => {
  if (e.target.id !== 'busca') return;
  filtro.q = e.target.value; const pos = e.target.selectionStart;
  pintar(); const n = $('#busca'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fInicio') return;
  e.preventDefault();
  const m = leerMonto(val('iMonto')), b = $('#iEmpezar');
  if (isNaN(m)) { $('#iErr').textContent = 'Escribe el monto en soles, por ejemplo 850 o 1250.50.'; return; }
  b.disabled = true;
  try { await guardarCfg({ saldo_inicial: m, fecha_inicial: hoy }); vista = 'resumen'; pintar(); }
  catch (er) { $('#iErr').textContent = er.message; b.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) cerrar(); });

function pintarTema() { const c = document.documentElement.getAttribute('data-tema') === 'claro'; $('#bTema').textContent = c ? '☾' : '☀'; const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = c ? '#F4F7FA' : '#0C1A2E'; }
$('#logo').innerHTML = yupana(24); $('#gLogo').innerHTML = yupana(48); pintarTema();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
comprobar();
</script>
